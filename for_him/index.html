<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>for him 🖤</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="phone">

    <div class="status-bar">
        <span>9:41</span>
        <span>●●● ᯤ 🔋</span>
    </div>

    <div class="screen">

        <!-- HOME SCREEN -->
        <div id="home">

            <div class="date">
                <span>Thursday, September 10</span>
                <h1>9:41</h1>
            </div>

            <div class="apps">

                <div class="app" onclick="openApp('peep')">
                    <div class="icon">🖤</div>
                    <span>Peep</span>
                </div>

                <div class="app" onclick="openApp('monster')">
                    <div class="icon">🥤</div>
                    <span>Monster</span>
                </div>

                <div class="app" onclick="openApp('anime')">
                    <div class="icon">🎀</div>
                    <span>Anime</span>
                </div>

                <div class="app" onclick="openApp('geass')">
                    <div class="icon">👁️</div>
                    <span>GEASS</span>
                </div>

                <div class="app" onclick="openApp('csm')">
                    <div class="icon">🩸</div>
                    <span>CSM</span>
                </div>

                <div class="app" onclick="openApp('dbd')">
                    <div class="icon">☠️</div>
                    <span>DBD</span>
                </div>

                <div class="app" onclick="openApp('messages')">
                    <div class="icon">💬</div>
                    <span>Messages</span>
                </div>

                <div class="app" onclick="openApp('secret')">
                    <div class="icon">?</div>
                    <span>???</span>
                </div>

            </div>

            <div class="dock">
                <div class="dock-icon">📞</div>
                <div class="dock-icon">💬</div>
                <div class="dock-icon">🌐</div>
                <div class="dock-icon">🎵</div>
            </div>

        </div>


        <!-- APP SCREEN -->

        <div id="appScreen">

            <div class="appHeader">
                <button onclick="goHome()">‹</button>
                <span id="appTitle">App</span>
            </div>

            <div id="appContent"></div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>
</html>
